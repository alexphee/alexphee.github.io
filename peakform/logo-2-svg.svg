<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#131c2e" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Outer Plates -->
  <rect x="96" y="170" width="28" height="130" rx="10" fill="#f8fafc" />
  <rect x="388" y="170" width="28" height="130" rx="10" fill="#f8fafc" />
  
  <!-- Inner Plates -->
  <rect x="132" y="190" width="18" height="90" rx="6" fill="#94a3b8" />
  <rect x="362" y="190" width="18" height="90" rx="6" fill="#94a3b8" />

  <!-- Pulse Peak Barbell Shaft -->
  <path d="M150 235 H210 L235 150 L260 300 L285 200 L302 235 H362" 
        fill="none" 
        stroke="url(#glowGrad2)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Minimalist Typography -->
  <text x="256" y="415" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="9" 
